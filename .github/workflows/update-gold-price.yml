name: Update gold price

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect live price
        timeout-minutes: 5
        run: xvfb-run -a npm run collect

      - name: Upload error screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gold-error-screen
          path: gold-error.png
          if-no-files-found: ignore

      - name: Commit updated JSON
        if: success()
        run: |
          git config user.name "boldoro-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gold-price.json
          git diff --cached --quiet && exit 0
          git commit -m "Update gold price"
          git push
